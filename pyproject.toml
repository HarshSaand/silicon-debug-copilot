[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-debug-copilot"
version = "0.1.0"
description = "Deterministic, evidence-grounded system-log triage"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "python-multipart>=0.0.9",
  "streamlit>=1.32,<2",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

