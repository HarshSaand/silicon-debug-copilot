name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Verify benchmark hash
        run: sha256sum -c evals/frozen_benchmark.sha256
      - name: Test
        run: python -m pytest
      - name: Re-run saved baseline
        run: python scripts/evaluate.py --split test --output /tmp/results.json
      - name: Run integrated workflow evaluation
        run: python scripts/evaluate.py --split test --core --output /tmp/core_results.json
